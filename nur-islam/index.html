<!doctype html>
<html lang="fr" data-theme="nuit">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nûr — Compagnon islamique en 3D</title>
  <meta name="description" content="Nûr : horaires de prière, Coran, qibla, tasbih 3D, 99 Noms d'Allah, récits des prophètes, guide de la prière, calendrier hégirien, zakât et quiz — hors-ligne et sans compte.">
  <meta name="theme-color" content="#060d1f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <div id="shell">
    <header class="topbar" id="topbar">
      <a class="brand" href="#/accueil" aria-label="Nûr — accueil">
        <svg viewBox="0 0 48 48" class="brand-mark" aria-hidden="true"><use href="#i-star8"/></svg>
        <span class="brand-name">Nûr</span><span class="brand-ar" lang="ar">نور</span>
      </a>
      <div class="topbar-right">
        <button class="hijri-chip" id="hijriChip" type="button" aria-label="Ouvrir le calendrier hégirien"></button>
      </div>
    </header>

    <main id="view" tabindex="-1" aria-live="polite"></main>

    <nav class="tabbar" id="tabbar" aria-label="Navigation principale"></nav>
  </div>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem;color:#fff">Nûr a besoin de JavaScript pour fonctionner.</p></noscript>
  <script src="app.js" defer></script>
</body>
</html>
